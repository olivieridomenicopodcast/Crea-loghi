<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Logo Olivieri Domenico</title>
<meta name="description" content="Scarica il logo ufficiale, le varianti e i banner di Olivieri Domenico">
<meta name="theme-color" content="#2A1FA6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Logo DO">
<link rel="stylesheet" href="stile.css">
</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <img class="brand" src="icons/icon-192.png" alt="" width="44" height="44">
    <div class="top-t"><h1>Logo Olivieri Domenico</h1><p>Podcast coach, editor e sound designer</p></div>
  </div>
</header>
<main class="wrap">
  <section class="tutto" aria-labelledby="t-zip">
    <div><h2 id="t-zip">Tutto il set</h2><p id="zip-nota">Logo ufficiale, varianti e banner in PNG e SVG, in un unico ZIP.</p></div>
    <a id="zip" class="btn big" href="logo-olivieri-domenico.zip" download="logo-olivieri-domenico.zip">Scarica tutto (ZIP)</a>
  </section>
  <div id="installa" class="install" hidden>
    <span id="installa-testo">Installa l'app per averla sempre a portata di mano, anche offline.</span>
    <button id="installa-btn" class="btn ghost" type="button" hidden>Installa</button>
  </div>
  <div id="gruppi"></div>
  <p id="stato" class="stato" role="status"></p>
</main>
<script src="app.js"></script>
</body>
</html>
