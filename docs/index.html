<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Logo Olivieri Domenico</title>
<meta name="description" content="Scarica il logo ufficiale, le varianti e i banner di Olivieri Domenico">
<meta name="theme-color" content="#2A1FA6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Logo DO">
<link rel="stylesheet" href="stile.css">
</head>
<body>
<main>
  <h1>Logo Olivieri Domenico</h1>
  <p class="lead">Tocca "Scarica PNG" o "Scarica SVG" sul file che ti serve. Per il banner LinkedIn usa il PNG.</p>
  <div id="installa" class="install" hidden>
    <span id="installa-testo">Installa l'app per averla sempre a portata di mano, anche offline.</span>
    <button id="installa-btn" class="btn ghost" type="button" hidden>Installa</button>
  </div>
  <div id="principali" class="grid"></div>
  <details id="altre" class="altre" hidden>
    <summary id="altre-titolo"></summary>
    <p id="altre-desc" class="altre-d"></p>
    <div id="altre-grid" class="grid"></div>
  </details>
  <section class="all">
    <div><h2>Tutto il set</h2><p id="zip-nota">Logo ufficiale, varianti e banner, in PNG e SVG (ZIP)</p></div>
    <div class="row"><a id="zip" class="btn" href="logo-olivieri-domenico.zip" download="logo-olivieri-domenico.zip">Scarica ZIP</a></div>
  </section>
  <div id="msg" role="status"></div>
</main>
<script src="app.js"></script>
</body>
</html>
